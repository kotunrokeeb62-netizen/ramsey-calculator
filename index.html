<!DOCTYPE html>
<html>
<head>
    <title>Ramsey Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
            transition: 0.3s;
        }

        .calculator {
            width: 100%;
            max-width: 380px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        h1 {
            text-align: center;
        }

        #display {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
            color: #222;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 18px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #e6e6e6;
            color: #222;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .clear {
            grid-column: span 2;
        }

        .dark-mode {
            width: 100%;
            margin-bottom: 15px;
            background: #333;
            color: white;
        }

        .history {
            margin-top: 20px;
            padding: 10px;
            background: #f7f7f7;
            border-radius: 10px;
            transition: 0.3s;
        }

        #historyList {
            padding-left: 20px;
            word-break: break-word;
        }

        .history button {
            font-size: 16px;
            padding: 12px;
        }

        body.dark {
            background: #111;
            color: white;
        }

        body.dark .calculator {
            background: #222;
        }

        body.dark #display {
            background: #111;
            color: white;
            border-color: #555;
        }

        body.dark button {
            background: #444;
            color: white;
        }

        body.dark .dark-mode {
            background: #ddd;
            color: #111;
        }

        body.dark .history {
            background: #333;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Ramsey Calculator</h1>

    <button class="dark-mode" onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

    <input id="display" type="text" readonly>

    <div class="buttons">

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('/')">÷</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('*')">×</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('-')">−</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="press('+')">+</button>

        <button class="clear" onclick="clearDisplay()">CLEAR</button>
        <button onclick="backspace()">⌫</button>

    </div>

    <div class="history">

        <h3>History</h3>

        <ul id="historyList"></ul>

        <button onclick="clearHistory()">Clear History</button>

    </div>

</div>


<script>

let display = document.getElementById("display");
let historyList = document.getElementById("historyList");


/* CALCULATOR */

function press(value) {
    display.value += value;
}


function clearDisplay() {
    display.value = "";
}


function backspace() {
    display.value = display.value.slice(0, -1);
}


function calculate() {

    if (display.value === "") {
        return;
    }

    try {

        if (display.value.includes("/0")) {
            display.value = "Cannot divide by zero";
            return;
        }

        let expression = display.value;

        let answer = eval(expression);

        let calculation = expression + " = " + answer;

        display.value = answer;

        addToHistory(calculation);

    } catch {

        display.value = "Invalid calculation";

    }
}


/* HISTORY */

function addToHistory(calculation) {

    let item = document.createElement("li");

    item.textContent = calculation;

    historyList.appendChild(item);

    saveHistory();

}


function saveHistory() {

    localStorage.setItem(
        "calculatorHistory",
        historyList.innerHTML
    );

}


function loadHistory() {

    let savedHistory = localStorage.getItem(
        "calculatorHistory"
    );

    if (savedHistory) {

        historyList.innerHTML = savedHistory;

    }

}


function clearHistory() {

    historyList.innerHTML = "";

    localStorage.removeItem(
        "calculatorHistory"
    );

}


/* DARK MODE */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {

        localStorage.setItem(
            "darkMode",
            "on"
        );

    } else {

        localStorage.setItem(
            "darkMode",
            "off"
        );

    }

}


/* LOAD DARK MODE */

if (localStorage.getItem("darkMode") === "on") {

    document.body.classList.add("dark");

}


/* LOAD SAVED HISTORY */

loadHistory();

</script>

</body>
</html>
