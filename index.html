<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramsey Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #172033;
            display: flex;
            justify-content: center;
            padding: 20px 12px;
            transition: 0.3s ease;
        }

        .calculator {
            width: 100%;
            max-width: 460px;
            padding: 20px;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 18px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: auto;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(37,99,235,0.3);
        }

        h1 {
            margin: 10px 0 4px;
            font-size: 25px;
        }

        .subtitle {
            margin: 0;
            font-size: 13px;
            opacity: 0.65;
        }

        #display {
            width: 100%;
            height: 75px;
            padding: 15px;
            margin: 8px 0 14px;
            border: none;
            border-radius: 16px;
            background: #f1f5f9;
            color: #111827;
            font-size: 28px;
            text-align: right;
            outline: none;
        }

        .top-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .top-button {
            border: none;
            border-radius: 12px;
            padding: 13px 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #e8eef7;
            color: #172033;
        }

        .scientific {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        button {
            border: none;
            border-radius: 13px;
            padding: 16px 6px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            background: #edf1f5;
            color: #172033;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: scale(0.94);
        }

        .scientific button {
            background: #e1e9f5;
            font-size: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .operator {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .equals {
            background: #2563eb;
            color: white;
        }

        .clear {
            grid-column: span 2;
            background: #fee2e2;
            color: #dc2626;
        }

        .history {
            margin-top: 20px;
            padding: 15px;
            border-radius: 16px;
            background: #f5f7fa;
        }

        .history h3 {
            margin-top: 0;
        }

        #historyList {
            padding-left: 20px;
            word-break: break-word;
            max-height: 180px;
            overflow-y: auto;
        }

        .history button {
            width: 100%;
            padding: 12px;
            font-size: 14px;
        }

        /* DARK MODE */

        body.dark {
            background: #070b14;
            color: #f8fafc;
        }

        body.dark .calculator {
            background: #111827;
            box-shadow: 0 15px 45px rgba(0,0,0,0.45);
        }

        body.dark #display {
            background: #070b14;
            color: white;
        }

        body.dark .top-button {
            background: #1f2937;
            color: white;
        }

        body.dark button {
            background: #1f2937;
            color: #f8fafc;
        }

        body.dark .scientific button {
            background: #263449;
        }

        body.dark .operator {
            background: #1e3a8a;
            color: #bfdbfe;
        }

        body.dark .equals {
            background: #2563eb;
            color: white;
        }

        body.dark .clear {
            background: #451a1a;
            color: #fca5a5;
        }

        body.dark .history {
            background: #1a2333;
        }

        @media (max-width: 380px) {
            .calculator {
                padding: 14px;
            }

            button {
                padding: 14px 4px;
                font-size: 16px;
            }

            #display {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <div class="brand">
        <div class="brand-icon">RC</div>
        <h1>Ramsey Calculator</h1>
        <p class="subtitle">Fast • Simple • Scientific</p>
    </div>

    <div class="top-buttons">
        <button class="top-button" onclick="toggleDarkMode()">
            🌙 Theme
        </button>

        <button class="top-button" onclick="toggleScientific()">
            🧪 Scientific
        </button>

        <button class="top-button" onclick="toggleAngleMode()">
            Angle: <span id="angleMode">DEG</span>
        </button>
    </div>

    <input id="display" type="text" readonly>

    <div id="scientificButtons" class="scientific">

        <button onclick="scientificFunction('sin')">sin</button>
        <button onclick="scientificFunction('cos')">cos</button>
        <button onclick="scientificFunction('tan')">tan</button>
        <button onclick="scientificFunction('asin')">sin⁻¹</button>

        <button onclick="scientificFunction('acos')">cos⁻¹</button>
        <button onclick="scientificFunction('atan')">tan⁻¹</button>
        <button onclick="scientificFunction('log')">log</button>
        <button onclick="scientificFunction('ln')">ln</button>

        <button onclick="squareRoot()">√</button>
        <button onclick="square()">x²</button>
        <button onclick="press('**')">xʸ</button>
        <button onclick="press(Math.PI)">π</button>

        <button onclick="press(Math.E)">e</button>
        <button onclick="percentage()">%</button>
        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>

    </div>

    <div class="buttons">

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('/')">÷</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="operator" onclick="press('*')">×</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="operator" onclick="press('-')">−</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button class="equals" onclick="calculate()">=</button>
        <button class="operator" onclick="press('+')">+</button>

        <button class="clear" onclick="clearDisplay()">CLEAR</button>
        <button onclick="backspace()">⌫</button>

    </div>

    <div class="history">

        <h3>History</h3>

        <ul id="historyList"></ul>

        <button onclick="clearHistory()">Clear History</button>

    </div>

</div>

<script>

let display = document.getElementById("display");
let historyList = document.getElementById("historyList");
let angleMode = document.getElementById("angleMode");

let currentAngleMode =
    localStorage.getItem("angleMode") || "DEG";

function press(value) {
    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function backspace() {
    display.value = display.value.slice(0, -1);
}

function calculate() {

    if (display.value === "") return;

    try {

        let expression = display.value;

        if (/\/0(?!\d)/.test(expression)) {
            display.value = "Cannot divide by zero";
            return;
        }

        let answer = eval(expression);

        if (!Number.isFinite(answer)) {
            display.value = "Invalid result";
            return;
        }

        let calculation =
            expression + " = " + answer;

        display.value = answer;

        addToHistory(calculation);

    } catch {

        display.value = "Invalid calculation";

    }
}

function toggleAngleMode() {

    currentAngleMode =
        currentAngleMode === "DEG" ? "RAD" : "DEG";

    angleMode.textContent = currentAngleMode;

    localStorage.setItem(
        "angleMode",
        currentAngleMode
    );
}

angleMode.textContent = currentAngleMode;

function toRadians(number) {

    return currentAngleMode === "DEG"
        ? number * Math.PI / 180
        : number;
}

function fromRadians(number) {

    return currentAngleMode === "DEG"
        ? number * 180 / Math.PI
        : number;
}

function scientificFunction(type) {

    if (display.value === "") return;

    let number = Number(display.value);
    let answer;
    let calculation;

    if (!Number.isFinite(number)) {
        display.value = "Invalid number";
        return;
    }

    if (type === "sin") {
        answer = Math.sin(toRadians(number));
        calculation = "sin(" + number + ") = " + answer;
    }

    else if (type === "cos") {
        answer = Math.cos(toRadians(number));
        calculation = "cos(" + number + ") = " + answer;
    }

    else if (type === "tan") {

        let radians = toRadians(number);

        if (Math.abs(Math.cos(radians)) < 0.0000000001) {
            display.value = "Undefined";
            return;
        }

        answer = Math.tan(radians);
        calculation = "tan(" + number + ") = " + answer;
    }

    else if (type === "asin") {

        if (number < -1 || number > 1) {
            display.value = "Invalid number";
            return;
        }

        answer = fromRadians(Math.asin(number));
        calculation = "sin⁻¹(" + number + ") = " + answer;
    }

    else if (type === "acos") {

        if (number < -1 || number > 1) {
            display.value = "Invalid number";
            return;
        }

        answer = fromRadians(Math.acos(number));
        calculation = "cos⁻¹(" + number + ") = " + answer;
    }

    else if (type === "atan") {

        answer = fromRadians(Math.atan(number));
        calculation = "tan⁻¹(" + number + ") = " + answer;
    }

    else if (type === "log") {

        if (number <= 0) {
            display.value = "Invalid number";
            return;
        }

        answer = Math.log10(number);
        calculation = "log(" + number + ") = " + answer;
    }

    else if (type === "ln") {

        if (number <= 0) {
            display.value = "Invalid number";
            return;
        }

        answer = Math.log(number);
        calculation = "ln(" + number + ") = " + answer;
    }

    if (!Number.isFinite(answer)) {
        display.value = "Invalid result";
        return;
    }

    display.value = answer;
    addToHistory(calculation);
}

function squareRoot() {

    if (display.value === "") return;

    let number = Number(display.value);

    if (number < 0 || !Number.isFinite(number)) {
        display.value = "Invalid number";
        return;
    }

    let answer = Math.sqrt(number);

    display.value = answer;

    addToHistory(
        "√" + number + " = " + answer
    );
}

function square() {

    if (display.value === "") return;

    let number = Number(display.value);

    if (!Number.isFinite(number)) {
        display.value = "Invalid number";
        return;
    }

    let answer = number * number;

    display.value = answer;

    addToHistory(
        number + "² = " + answer
    );
}

function percentage() {

    if (display.value === "") return;

    let number = Number(display.value);

    if (!Number.isFinite(number)) {
        display.value = "Invalid number";
        return;
    }

    let answer = number / 100;

    display.value = answer;

    addToHistory(
        number + "% = " + answer
    );
}

function toggleScientific() {

    let scientificButtons =
        document.getElementById("scientificButtons");

    scientificButtons.style.display =
        scientificButtons.style.display === "none"
            ? "grid"
            : "none";
}

function addToHistory(calculation) {

    let item = document.createElement("li");

    item.textContent = calculation;

    historyList.appendChild(item);

    saveHistory();
}

function saveHistory() {

    localStorage.setItem(
        "calculatorHistory",
        historyList.innerHTML
    );
}

function loadHistory() {

    let savedHistory =
        localStorage.getItem("calculatorHistory");

    if (savedHistory) {
        historyList.innerHTML = savedHistory;
    }
}

function clearHistory() {

    historyList.innerHTML = "";

    localStorage.removeItem("calculatorHistory");
}

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
            ? "on"
            : "off"
    );
}

if (localStorage.getItem("darkMode") === "on") {
    document.body.classList.add("dark");
}

loadHistory();

</script>

</body>
</html>
