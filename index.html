<!DOCTYPE html>
<html>
<head>
    <title>Ramsey Scientific Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            display: flex;
            justify-content: center;
            padding: 25px 15px;
            transition: 0.3s;
        }

        .calculator {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        #display {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
            color: #222;
        }

        .top-button {
            width: 100%;
            margin-bottom: 10px;
            padding: 14px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        .scientific {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 15px 8px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #e6e6e6;
            color: #222;
        }

        button:active {
            transform: scale(0.95);
        }

        .scientific button {
            background: #d8d8d8;
        }

        .clear {
            grid-column: span 2;
        }

        .history {
            margin-top: 20px;
            padding: 10px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        #historyList {
            padding-left: 20px;
            word-break: break-word;
        }

        .history button {
            font-size: 16px;
            padding: 12px;
        }

        /* DARK MODE */

        body.dark {
            background: #111;
            color: white;
        }

        body.dark .calculator {
            background: #222;
        }

        body.dark #display {
            background: #111;
            color: white;
            border-color: #555;
        }

        body.dark button {
            background: #444;
            color: white;
        }

        body.dark .top-button {
            background: #ddd;
            color: #111;
        }

        body.dark .scientific button {
            background: #555;
        }

        body.dark .history {
            background: #333;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Ramsey Calculator</h1>

    <button class="top-button" onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

    <button class="top-button" onclick="toggleScientific()">
        🧪 Scientific Mode
    </button>

    <button class="top-button" onclick="toggleAngleMode()">
        Angle: <span id="angleMode">DEG</span>
    </button>

    <input id="display" type="text" readonly>


    <!-- SCIENTIFIC BUTTONS -->

    <div id="scientificButtons" class="scientific">

        <button onclick="scientificFunction('sin')">sin</button>
        <button onclick="scientificFunction('cos')">cos</button>
        <button onclick="scientificFunction('tan')">tan</button>
        <button onclick="scientificFunction('asin')">sin⁻¹</button>

        <button onclick="scientificFunction('acos')">cos⁻¹</button>
        <button onclick="scientificFunction('atan')">tan⁻¹</button>
        <button onclick="scientificFunction('log')">log</button>
        <button onclick="scientificFunction('ln')">ln</button>

        <button onclick="squareRoot()">√</button>
        <button onclick="square()">x²</button>
        <button onclick="press('**')">xʸ</button>
        <button onclick="press(Math.PI)">π</button>

        <button onclick="press(Math.E)">e</button>
        <button onclick="percentage()">%</button>
        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>

    </div>


    <!-- NORMAL BUTTONS -->

    <div class="buttons">

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('/')">÷</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('*')">×</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('-')">−</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="press('+')">+</button>

        <button class="clear" onclick="clearDisplay()">CLEAR</button>
        <button onclick="backspace()">⌫</button>

    </div>


    <!-- HISTORY -->

    <div class="history">

        <h3>History</h3>

        <ul id="historyList"></ul>

        <button onclick="clearHistory()">
            Clear History
        </button>

    </div>

</div>


<script>

let display = document.getElementById("display");
let historyList = document.getElementById("historyList");
let angleMode = document.getElementById("angleMode");

let currentAngleMode =
    localStorage.getItem("angleMode") || "DEG";


/* BASIC CALCULATOR */

function press(value) {
    display.value += value;
}


function clearDisplay() {
    display.value = "";
}


function backspace() {
    display.value =
        display.value.slice(0, -1);
}


function calculate() {

    if (display.value === "") {
        return;
    }

    try {

        let expression = display.value;

        if (expression.includes("/0")) {
            display.value = "Cannot divide by zero";
            return;
        }

        let answer = eval(expression);

        if (!Number.isFinite(answer)) {
            display.value = "Invalid result";
            return;
        }

        let calculation =
            expression + " = " + answer;

        display.value = answer;

        addToHistory(calculation);

    } catch {

        display.value = "Invalid calculation";

    }
}


/* ANGLE MODE */

function toggleAngleMode() {

    if (currentAngleMode === "DEG") {
        currentAngleMode = "RAD";
    } else {
        currentAngleMode = "DEG";
    }

    angleMode.textContent = currentAngleMode;

    localStorage.setItem(
        "angleMode",
        currentAngleMode
    );
}


angleMode.textContent = currentAngleMode;


/* TRIGONOMETRY */

function toRadians(number) {

    if (currentAngleMode === "DEG") {
        return number * Math.PI / 180;
    }

    return number;
}


function fromRadians(number) {

    if (currentAngleMode === "DEG") {
        return number * 180 / Math.PI;
    }

    return number;
}


function scientificFunction(type) {

    if (display.value === "") {
        return;
    }

    let number = Number(display.value);
    let answer;
    let calculation;

    if (!Number.isFinite(number)) {
        display.value = "Invalid number";
        return;
    }


    if (type === "sin") {

        answer = Math.sin(toRadians(number));
        calculation = "sin(" + number + ") = " + answer;

    }


    else if (type === "cos") {

        answer = Math.cos(toRadians(number));
        calculation = "cos(" + number + ") = " + answer;

    }


    else if (type === "tan") {

        let radians = toRadians(number);

        if (
            Math.abs(Math.cos(radians)) < 0.0000000001
        ) {
            display.value = "Undefined";
            return;
        }

        answer = Math.tan(radians);
        calculation = "tan(" + number + ") = " + answer;

    }


    else if (type === "asin") {

        if (number < -1 || number > 1) {
            display.value = "Invalid number";
            return;
        }

        answer = fromRadians(Math.asin(number));
        calculation = "sin⁻¹(" + number + ") = " + answer;

    }


    else if (type === "acos") {

        if (number < -1 || number > 1) {
            display.value = "Invalid number";
            return;
        }

        answer = fromRadians(Math.acos(number));
        calculation = "cos⁻¹(" + number + ") = " + answer;

    }


    else if (type === "atan") {

        answer = fromRadians(Math.atan(number));
        calculation = "tan⁻¹(" + number + ") = " + answer;

    }


    else if (type === "log") {

        if (number <= 0) {
            display.value = "Invalid number";
            return;
        }

        answer = Math.log10(number);
        calculation = "log(" + number + ") = " + answer;

    }


    else if (type === "ln") {

        if (number <= 0) {
            display.value = "Invalid number";
            return;
        }

        answer = Math.log(number);
        calculation = "ln(" + number + ") = " + answer;

    }


    if (!Number.isFinite(answer)) {
        display.value = "Invalid result";
        return;
    }

    display.value = answer;

    addToHistory(calculation);
}


/* SQUARE ROOT */

function squareRoot() {

    if (display.value === "") {
        return;
    }

    let number = Number(display.value);

    if (number < 0 || !Number.isFinite(number)) {
        display.value = "Invalid number";
        return;
    }

    let answer = Math.sqrt(number);

    let calculation =
        "√" + number + " = " + answer;

    display.value = answer;

    addToHistory(calculation);
}


/* SQUARE */

function square() {

    if (display.value === "") {
        return;
    }

    let number = Number(display.value);

    if (!Number.isFinite(number)) {
        display.value = "Invalid number";
        return;
    }

    let answer = number * number;

    let calculation =
        number + "² = " + answer;

    display.value = answer;

    addToHistory(calculation);
}


/* PERCENTAGE */

function percentage() {

    if (display.value === "") {
        return;
    }

    let number = Number(display.value);

    if (!Number.isFinite(number)) {
        display.value = "Invalid number";
        return;
    }

    let answer = number / 100;

    let calculation =
        number + "% = " + answer;

    display.value = answer;

    addToHistory(calculation);
}


/* SCIENTIFIC MODE */

function toggleScientific() {

    let scientificButtons =
        document.getElementById("scientificButtons");

    scientificButtons.style.display =
        scientificButtons.style.display === "none"
            ? "grid"
            : "none";
}


/* HISTORY */

function addToHistory(calculation) {

    let item =
        document.createElement("li");

    item.textContent = calculation;

    historyList.appendChild(item);

    saveHistory();
}


function saveHistory() {

    localStorage.setItem(
        "calculatorHistory",
        historyList.innerHTML
    );
}


function loadHistory() {

    let savedHistory =
        localStorage.getItem(
            "calculatorHistory"
        );

    if (savedHistory) {
        historyList.innerHTML =
            savedHistory;
    }
}


function clearHistory() {

    historyList.innerHTML = "";

    localStorage.removeItem(
        "calculatorHistory"
    );
}


/* DARK MODE */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    if (
        document.body.classList.contains("dark")
    ) {

        localStorage.setItem(
            "darkMode",
            "on"
        );

    } else {

        localStorage.setItem(
            "darkMode",
            "off"
        );
    }
}


/* LOAD DARK MODE */

if (
    localStorage.getItem("darkMode") === "on"
) {

    document.body.classList.add("dark");

}


/* LOAD HISTORY */

loadHistory();

</script>

</body>
</html>
